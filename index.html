<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fade In Image</title>
    <style>
      :root {
        --bg: #000000;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        font-family: sans-serif;
      }

      .image-wrap {
        width: min(92vw, 1100px);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .image-wrap img {
        width: 100%;
        height: auto;
        display: block;
        opacity: 0;
        transform: scale(0.98);
        animation: fadeIn 2.8s ease-in forwards;
        user-select: none;
        -webkit-user-drag: none;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: scale(0.98);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="image-wrap">
      <img src="./fadein.jpg" alt="Fading in artwork" />
    </div>
  </body>
</html>
